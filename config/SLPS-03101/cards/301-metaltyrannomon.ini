# MetalTyrannomon: a new Digimon card (docs/wiki/Cards.md; the format: src/patch/cards.hpp).
# The record starts as a copy of `base` (MasterTyrannomon: its attack animations go with its battle
# model), then the fields below replace its own. The support (conditions, effects and its text) is
# Devimon's: "If opponent's Specialty is Nature, own Attack Power is tripled."

[card]
number = 301
base = 8
name = MetalTyrannomon
specialty = darkness
level = ultimate
hp = 1680
dp = 50
plus_p = 10
fusion = 15
rarity = 30
cross_effect = jamming
support_from = 120
# Battle model F:\225.PAK (not on the disc, no card uses it): served as a copy of MasterTyrannomon's
# F:\124.PAK unless assets/<serial>/files/F/225.PAK exists (a model of its own).
model = 225
model_copy_of = 124
# The card art, under assets/<serial>/ (not in the repository: it is not ours to publish).
art = custom/cards/metaltyrannomon.png

[attack circle]
name = Giga Destroyer
power = 780

[attack triangle]
name = Nuclear Laser
power = 540

[attack cross]
name = Metal Fang
power = 300
